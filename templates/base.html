{% load static %}

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{{ clinic.name }}{% endblock %}</title>
    <meta name="description" content="{% block description %}Cabinet stomatologic cu un singur medic în {{ clinic.city }}. Consultație fără grabă, plan de tratament scris și preț spus înainte.{% endblock %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block head_extra %}{% endblock %}
</head>
<body>

<a class="skip-link" href="#main">Sari la conținut</a>

{% include "core/_urgency.html" %}

<span class="nav-probe" aria-hidden="true"></span>

{% include "core/_navbar.html" %}

<main id="main">
    {% block content %}{% endblock %}
</main>

{% include "core/_footer.html" %}

<script>
/* Navbarul are două stări. Nu ascultăm scroll — ar rula de zeci de ori pe
   secundă. Observăm o santinelă de 1px din capul paginii. */
(function () {
    const nav = document.querySelector(".topnav");
    const probe = document.querySelector(".nav-probe");

    if (nav && probe && "IntersectionObserver" in window) {
        new IntersectionObserver(
            ([e]) => nav.classList.toggle("pinned", !e.isIntersecting)
        ).observe(probe);
    }

    const burger = document.querySelector(".burger");
    const links = document.getElementById("navlinks");
    if (!burger || !links) return;

    const small = () => window.matchMedia("(max-width: 768px)").matches;
    const open = (v) => { burger.setAttribute("aria-expanded", String(v)); links.hidden = !v; };
    const sync = () => open(!small());

    sync();
    window.addEventListener("resize", sync);
    burger.addEventListener("click", () => open(burger.getAttribute("aria-expanded") !== "true"));
    links.addEventListener("click", (e) => { if (e.target.tagName === "A" && small()) open(false); });
})();
</script>

{% block scripts %}{% endblock %}

</body>
</html>
