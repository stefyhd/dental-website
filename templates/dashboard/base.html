{% load static %}

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Management{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body class="dashboard-body">

<div class="dashboard-layout">

    <aside class="sidebar">
        <h2>Cabinet</h2>

      
        <nav>
            <a href="{% url 'dashboard_home' %}">Today</a>
            <a href="{% url 'dashboard_appointments' %}">Appointments</a>
            <a href="{% url 'dashboard_patients' %}">Patients</a>
            <a href="{% url 'dashboard_schedule' %}">Schedule</a>
            <a href="{% url 'dashboard_services' %}">Services</a>
        </nav>
        

        <form method="post" action="{% url 'dashboard_logout' %}">
            {% csrf_token %}
            <button type="submit">Log out</button>
        </form>
    </aside>

    <main class="dashboard-main">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>

</div>

</body>
</html>
